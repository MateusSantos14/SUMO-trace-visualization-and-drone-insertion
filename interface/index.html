<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Pattern Configurator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #map {
      height: 600px;
    }

    .controls {
      margin-bottom: 20px;
    }

    .uav-list {
      margin-top: 20px;
    }

    .uav-list ul {
      list-style-type: none;
      padding: 0;
    }

    .uav-list li {
      margin: 5px 0;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .uav-list button {
      background: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .uav-list button:hover {
      background: #c82333;
    }

    .pattern-params {
      display: none;
      margin-top: 10px;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container-fluid mt-4">
    <h1 class="text-center mb-4">Drone Pattern Configurator</h1>
    <div class="row">
      <!-- Left Column: Controls and UAV List -->
      <div class="col-md-4">
        <div class="controls card p-4 shadow-sm">
          <div class="mb-3">
            <label for="xml-file" class="form-label">Upload Trace XML:</label>
            <input type="file" id="xml-file" class="form-control" accept=".xml">
            <small class="form-text text-muted">Upload the trace XML file to initialize the map.</small>
          </div>
          <div class="mb-3">
            <label for="pattern" class="form-label">Select Pattern:</label>
            <select id="pattern" class="form-select">
              <option value="">Escolha o padrão de mobilidade</option>
              <option value="circular">Circular</option>
              <option value="angular">Angular</option>
              <option value="tractor">Tractor</option>
              <option value="static">Static</option>
              <option value="following">Following</option>
              <option value="square">Square</option>
            </select>
          </div>
          <div id="pattern-params" class="pattern-params">
            <!-- Parameters for each pattern will be dynamically inserted here -->
          </div>
          <div class="d-grid gap-2">
            <button id="add-uav" class="btn btn-primary" disabled>Add UAV</button>
            <button id="generate-config" class="btn btn-success">Generate Config</button>
          </div>
        </div>
        <div class="uav-list card p-4 shadow-sm mt-4">
          <h3>UAV List</h3>
          <ul id="uav-list"></ul>
        </div>
      </div>
      <!-- Right Column: Map -->
      <div class="col-md-8">
        <div id="map" class="card shadow-sm"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let map;
    const patternSelect = document.getElementById('pattern');
    const patternParams = document.getElementById('pattern-params');
    const uavList = document.getElementById('uav-list');
    const xmlFileInput = document.getElementById('xml-file');
    const addUAVButton = document.getElementById('add-uav');
    let savedPoint = null; // Store the latest unassigned point
    const uavs = []; // Stores UAV configurations
    const markers = []; // Stores markers for each UAV

    // Initialize map
    function initializeMap(bounds) {
      map = L.map('map').fitBounds(bounds);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // Attach click handler
      map.on('click', handleMapClick);

      // Enable/disable map clicks based on pattern
      patternSelect.addEventListener('change', () => {
        if (patternSelect.value === 'following') {
          map.off('click', handleMapClick); // Disable map clicks for "following" pattern
          addUAVButton.disabled = false; // Enable "Add UAV" button for "following" pattern
        } else {
          map.on('click', handleMapClick); // Enable map clicks for other patterns
          addUAVButton.disabled = savedPoint === null; // Enable "Add UAV" button if a point exists
        }
      });
    }
    // Get HTML for pattern parameters
    function getPatternParamsHTML(pattern) {
      switch (pattern) {
        case 'circular':
          return `
            <div class="mb-3">
              <label for="radius-meters" class="form-label">Radius (meters):</label>
              <input type="number" id="radius-meters" class="form-control" value="40">
            </div>
            <div class="mb-3">
              <label for="max-speed" class="form-label">Max Speed (m/s):</label>
              <input type="number" id="max-speed" class="form-control" value="10">
            </div>
            <div class="mb-3">
              <label for="start-angle" class="form-label">Start Angle (degrees):</label>
              <input type="number" id="start-angle" class="form-control" value="0">
            </div>
          `;
        case 'angular':
          return `
            <div class="mb-3">
              <label for="max-length" class="form-label">Max Length (meters):</label>
              <input type="number" id="max-length" class="form-control" value="40">
            </div>
            <div class="mb-3">
              <label for="max-turns" class="form-label">Max Turns:</label>
              <input type="number" id="max-turns" class="form-control" value="3">
            </div>
            <div class="mb-3">
              <label for="angle-alpha" class="form-label">Angle Alpha (degrees):</label>
              <input type="number" id="angle-alpha" class="form-control" value="30">
            </div>
            <div class="mb-3">
              <label for="max-speed" class="form-label">Max Speed (m/s):</label>
              <input type="number" id="max-speed" class="form-control" value="10">
            </div>
          `;
        case 'tractor':
          return `
            <div class="mb-3">
              <label for="width-between-tracks" class="form-label">Width Between Tracks (meters):</label>
              <input type="number" id="width-between-tracks" class="form-control" value="70">
            </div>
            <div class="mb-3">
              <label for="max-length" class="form-label">Max Length (meters):</label>
              <input type="number" id="max-length" class="form-control" value="100">
            </div>
            <div class="mb-3">
              <label for="max-turns" class="form-label">Max Turns:</label>
              <input type="number" id="max-turns" class="form-control" value="6">
            </div>
            <div class="mb-3">
              <label for="orientation" class="form-label">Orientation:</label>
              <select id="orientation" class="form-select">
                <option value="horizontal">Horizontal</option>
                <option value="vertical">Vertical</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="max-speed" class="form-label">Max Speed (m/s):</label>
              <input type="number" id="max-speed" class="form-control" value="10">
            </div>
          `;
        case 'following':
          return `
            <div class="mb-3">
              <label for="vehicle-id" class="form-label">Vehicle ID:</label>
              <input type="text" id="vehicle-id" class="form-control">
            </div>
            <div class="mb-3">
              <label for="offset-distance" class="form-label">Offset Distance (meters):</label>
              <input type="number" id="offset-distance" class="form-control" value="10">
            </div>
            <div class="mb-3">
              <label for="max-speed" class="form-label">Max Speed (m/s):</label>
              <input type="number" id="max-speed" class="form-control" value="10">
            </div>
          `;
        case 'square':
          return `
            <div class="mb-3">
              <label for="side-length" class="form-label">Side Length (meters):</label>
              <input type="number" id="side-length" class="form-control" value="50">
            </div>
            <div class="mb-3">
              <label for="angle-degrees" class="form-label">Angle (degrees):</label>
              <input type="number" id="angle-degrees" class="form-control" value="90">
            </div>
            <div class="mb-3">
              <label for="max-speed" class="form-label">Max Speed (m/s):</label>
              <input type="number" id="max-speed" class="form-control" value="10">
            </div>
          `;
        default:
          return '';
      }
    }

    // Handle map clicks
    function handleMapClick(e) {
      console.log('Map clicked at:', e.latlng); // Debugging log

      const pattern = patternSelect.value;
      if (pattern === 'following') return; // Disable map clicks for "following" pattern

      // If a point already exists, replace it
      if (savedPoint) {
        markers[0].setLatLng(e.latlng); // Update the marker position
        console.log('Marker updated:', markers[0]); // Debugging log
      } else {
        // Add a new marker
        const marker = L.marker(e.latlng).addTo(map)
          .bindPopup(`Pattern: ${pattern}`)
          .openPopup();
        markers.push(marker); // Store the marker
        console.log('New marker added:', marker); // Debugging log
      }

      // Update the saved point
      savedPoint = {
        lat: e.latlng.lat,
        lng: e.latlng.lng,
        pattern
      };

      // Enable the "Add UAV" button
      addUAVButton.disabled = false;

      console.log('Saved Point:', savedPoint); // Debugging log
    }

    // Get pattern parameters
    function getPatternParams() {
      const pattern = patternSelect.value;
      if (!savedPoint) return null; // Ensure savedPoint is not null

      switch (pattern) {
        case 'circular':
          return {
            center: `${savedPoint.lng},${savedPoint.lat}`,
            radius_meters: parseInt(document.getElementById('radius-meters').value),
            max_speed: parseInt(document.getElementById('max-speed').value),
            start_angle: parseInt(document.getElementById('start-angle').value)
          };
        case 'angular':
          return {
            start_point: `${savedPoint.lng},${savedPoint.lat}`,
            max_length: parseInt(document.getElementById('max-length').value),
            max_turns: parseInt(document.getElementById('max-turns').value),
            angle_alpha: parseInt(document.getElementById('angle-alpha').value),
            max_speed: parseInt(document.getElementById('max-speed').value)
          };
        case 'tractor':
          return {
            start_point: `${savedPoint.lng},${savedPoint.lat}`,
            width_between_tracks: parseInt(document.getElementById('width-between-tracks').value),
            max_length: parseInt(document.getElementById('max-length').value),
            max_turns: parseInt(document.getElementById('max-turns').value),
            orientation: document.getElementById('orientation').value,
            max_speed: parseInt(document.getElementById('max-speed').value)
          };
        case 'static':
          return {
            point: `${savedPoint.lng},${savedPoint.lat}`
          };
        case 'following':
          return {
            vehicle_id: document.getElementById('vehicle-id').value,
            offset_distance: parseInt(document.getElementById('offset-distance').value),
            max_speed: parseInt(document.getElementById('max-speed').value)
          };
        case 'square':
          return {
            center_point: `${savedPoint.lng},${savedPoint.lat}`,
            side_length: parseInt(document.getElementById('side-length').value),
            angle_degrees: parseInt(document.getElementById('angle-degrees').value),
            max_speed: parseInt(document.getElementById('max-speed').value)
          };
        default:
          return null;
      }
    }

    // Add UAV to the list
    addUAVButton.addEventListener('click', () => {
      const pattern = patternSelect.value;
      const params = getPatternParams();

      console.log(params);

      // Check if all parameters are filled
      if (!params) {
        alert('Please fill in all required parameters.');
        return;
      }

      // For patterns other than "following", check if a point is selected on the map
      if (pattern !== 'following' && !savedPoint) {
        alert('Please select a point on the map.');
        return;
      }

      // Create the UAV object with the pattern and parameters
      const uav = { pattern, ...params };

      // Add the UAV to the list
      uavs.push(uav);
      console.log('UAV added:', uav); // Debugging

      // Clear the saved point and remove the marker from the map
      savedPoint = null;
      if (markers.length > 0) {
        markers[0].remove(); // Remove the marker from the map
        markers.splice(0, 1); // Remove the marker from the array
        console.log('Marker removed'); // Debugging
      }

      // Update the UAV list in the UI
      renderUAVList();
    });

    // Render UAV list
    function renderUAVList() {
      uavList.innerHTML = ''; // Clear the current list

      uavs.forEach((uav, index) => {
        const li = document.createElement('li');
        li.textContent = `UAV ${index + 1}: ${uav.pattern} - ${JSON.stringify(uav)}`;

        // Button to remove the UAV from the list
        const removeButton = document.createElement('button');
        removeButton.textContent = 'Remove';
        removeButton.addEventListener('click', () => {
          uavs.splice(index, 1); // Remove the UAV from the list
          renderUAVList(); // Update the UI
        });

        li.appendChild(removeButton);
        uavList.appendChild(li);
      });
    }

    // Generate config file
    document.getElementById('generate-config').addEventListener('click', () => {
      const tracePath = xmlFileInput.files[0]?.name || 'manhattan.xml';
      const config = {
        Simulation: { trace_path: tracePath }
      };

      uavs.forEach((uav, index) => {
        const droneName = `Drone${uav.pattern.charAt(0).toUpperCase() + uav.pattern.slice(1)}${index + 1}`;
        config[droneName] = uav;
      });

      config['ExportVideo'] = {
        video_directory: 'output_video',
        only_vants: 0
      };

      config['ExportXML'] = {
        new_xml_path: 'output_simulation.xml'
      };

      // Send the config to the server to generate the config.ini file
      fetch('/generate-config', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(config),
      })
        .then(response => response.blob())
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'config.ini';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
          alert('Config file saved successfully!');
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Failed to generate config file.');
        });
    });
  </script>
</body>

</html>
